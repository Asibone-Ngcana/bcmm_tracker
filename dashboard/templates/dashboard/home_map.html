<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCMM Delivery Tracker</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .navbar {
            background-color: #0d6efd;
            color: white;
            padding: 1.2rem 1rem;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .map-wrapper {
            background-color: #e9ecef;
            height: 400px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 2rem;
            border: 2px solid #dee2e6;
        }

        .map-icon {
            font-size: 4rem;
            color: #adb5bd;
            margin-bottom: 15px;
        }

        .map-text {
            color: #6c757d;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .overlay-stats {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            color: #dc3545;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .overlay-ward {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            color: #0d6efd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            font-size: 0.95rem;
        }

        .action-container {
            margin-top: auto;
            padding-bottom: 10px;
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 20px;
            background-color: #198754;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            box-sizing: border-box;
            box-shadow: 0 6px 12px rgba(25, 135, 84, 0.3);
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 2px 6px rgba(25, 135, 84, 0.3);
            background-color: #157347;
        }
    </style>
</head>
<body>
    <div class="navbar">
        BCMM Delivery Tracker
    </div>

    <div class="main-content">
        <div class="map-wrapper">
            <div class="overlay-ward">📍 {{ ward }}</div>
            <div class="overlay-stats">
                <span style="font-size: 1.2rem;">⚠️</span>
                <span>{{ active_faults }} Active Faults</span>
            </div>
            
            <div class="map-icon">🗺️</div>
            <div class="map-text">Interactive Map Placeholder</div>
        </div>

        <div class="action-container">
            <a href="/report/" class="btn-primary">+ Report a New Fault</a>
        </div>
    </div>
</body>
</html>
